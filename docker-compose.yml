# Локальный запуск / просмотр: docker compose up --build  →  http://localhost:3000
# Для боевого сервера с доменом и HTTPS используйте docker-compose.prod.yml.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_INSTALLMENT_MONTHS: "${NEXT_PUBLIC_INSTALLMENT_MONTHS:-0}"
    container_name: sportliner
    ports:
      - "${APP_PORT:-3000}:3000"
    # All settings come from .env (see .env.example); the lines below only
    # pin what must be fixed inside the container.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      PORT: "3000"
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
    volumes:
      # Database, uploaded photos and backups survive `docker compose down`.
      - db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  db-data:
