services:
  app:
    build: .
    container_name: movigym-demo
    ports:
      # Host port is configurable: set APP_PORT in .env (or the shell) if 3000
      # is already taken. Container port stays 3000.
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "file:./dev.db"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
      PORT: "3000"
